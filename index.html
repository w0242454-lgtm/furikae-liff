<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>振替申請（試作）</title>
<style>
  :root {
    --green: #06C755; --green-dark: #05a647; --bg: #f5f6f7; --card: #fff;
    --text: #222; --sub: #6b7280; --line: #e3e5e8; --err: #d93025; --warn-bg: #fff4e5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px; line-height: 1.5; }
  header { position: sticky; top: 0; z-index: 5; background: var(--green); color: #fff;
    padding: 14px 16px; font-weight: 700; font-size: 18px; }
  header small { display: block; font-weight: 400; font-size: 12px; opacity: .9; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 12px 120px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .card h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .req { font-size: 11px; color: #fff; background: var(--err); border-radius: 4px; padding: 1px 5px; font-weight: 400; }
  .opt { font-size: 11px; color: var(--sub); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-weight: 400; }
  label.field { display: block; margin-bottom: 10px; }
  label.field > span { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  input[type=text], input[type=date], select, textarea {
    width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--text); }
  textarea { min-height: 72px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--green); border-color: transparent; }
  .seg { display: flex; gap: 8px; }
  .seg label { flex: 1; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; text-align: center; padding: 10px; border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer; }
  .seg input:checked + span { background: var(--green); color: #fff; border-color: var(--green); font-weight: 700; }
  .seg input:focus-visible + span { outline: 2px solid var(--green-dark); }
  .row { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; position: relative; }
  .row-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row-grid .full { grid-column: 1 / -1; }
  .wd { font-size: 13px; color: var(--sub); margin-top: 2px; min-height: 1em; }
  .wd.sun { color: var(--err); }
  .del { border: none; background: none; color: var(--err); font-size: 13px; padding: 4px 6px; cursor: pointer; }
  .add { width: 100%; padding: 10px; border: 1px dashed var(--green); color: var(--green-dark);
    background: #f0fbf4; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }
  .notice { background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 8px; }
  .err { color: var(--err); font-size: 13px; margin-top: 4px; }
  .errors { background: #fdecea; color: var(--err); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  .errors ul { margin: 4px 0 0; padding-left: 18px; }
  .hidden { display: none !important; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  footer button { display: block; width: 100%; max-width: 560px; margin: 0 auto; padding: 14px;
    font: inherit; font-weight: 700; color: #fff; background: var(--green); border: none; border-radius: 10px; cursor: pointer; }
  footer button:disabled { background: #b8c2bb; cursor: not-allowed; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .modal { background: #fff; width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 16px;
    max-height: 85vh; overflow: auto; }
  .modal h3 { margin: 0 0 8px; font-size: 16px; }
  .bubble { background: #8de055; border-radius: 14px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; margin: 8px 0 12px auto; max-width: 92%; }
  .chatbg { background: #7a9ccc; border-radius: 10px; padding: 8px; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btns button { flex: 1; padding: 12px; font: inherit; font-weight: 700; border-radius: 10px; cursor: pointer; }
  .btn-sub { background: #fff; border: 1px solid var(--line); color: var(--text); }
  .btn-main { background: var(--green); border: none; color: #fff; }
  .choice { flex: 1; padding: 14px; font: inherit; font-weight: 700; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--text); }
  .choice.on { background: var(--green); color: #fff; border-color: var(--green); }
  .closebtn { display: block; width: 100%; margin-top: 10px; padding: 10px; font: inherit; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .proto { font-size: 12px; color: var(--sub); text-align: center; margin: 4px 0 12px; }
</style>
</head>
<body>
<header>振替申請<small>SEIZE 講師アカウント（LINEにつなぐ前の試作です）</small></header>

<main>
  <div id="errors" class="errors hidden" role="alert"></div>

  <section class="card" id="step1">
    <h2>社員に振替の報告をしましたか？</h2>
    <div class="seg">
      <button type="button" class="choice" id="yes">はい</button>
      <button type="button" class="choice" id="no">いいえ</button>
    </div>
    <div id="notReported" class="notice hidden">
      まずは社員に振替の報告をしてください。報告が済んだら、もう一度メニューの「振替申請」から申請してください。
      <button type="button" class="closebtn" id="close">閉じる</button>
    </div>
  </section>

  <div id="body" class="hidden">
  <section class="card">
    <h2>報告した社員 <span class="req">必須</span></h2>
    <select id="staff" aria-label="報告した社員">
      <option value="">選んでください</option>
    </select>
  </section>
    <section class="card">
      <h2>基本情報</h2>
      <label class="field"><span>生徒氏名 <span class="req">必須</span></span>
        <input type="text" id="student" placeholder="例：山田太郎" autocomplete="off"></label>
      <label class="field"><span>学年 <span class="opt">任意</span></span>
        <select id="grade"></select></label>
      <div class="field"><span style="display:block;font-size:13px;color:var(--sub);margin-bottom:4px">区分 <span class="req">必須</span></span>
        <div class="seg" role="radiogroup" aria-label="区分">
          <label><input type="radio" name="category" value="生徒都合"><span>生徒都合</span></label>
          <label><input type="radio" name="category" value="講師都合"><span>講師都合</span></label>
        </div>
      </div>
      <label class="field" style="margin-top:10px"><span>理由 <span class="opt">任意</span></span>
        <textarea id="reason" placeholder="例：学会のため"></textarea></label>
    </section>

    <section class="card">
      <h2>振替元（休む授業） <span class="req">1件以上</span></h2>
      <div id="list-from"></div>
      <button type="button" class="add" data-add="from">＋ 振替元を追加</button>
    </section>

    <section class="card">
      <h2>振替決定日 <span class="opt">決まっていれば</span></h2>
      <div id="list-decided"></div>
      <button type="button" class="add" data-add="decided">＋ 決定日を追加</button>
    </section>

    <section class="card">
      <h2>振替希望日 <span class="opt">未定なら</span></h2>
      <div id="list-wished"></div>
      <button type="button" class="add" data-add="wished">＋ 希望日を追加</button>
      <p class="err" style="color:var(--sub)">決定日か希望日のどちらかを1件以上入れてください。</p>
    </section>

    <section class="card">
      <h2>備考 <span class="opt">任意</span></h2>
      <textarea id="note"></textarea>
    </section>
  </div>
</main>

<footer><button type="button" id="submit" disabled>内容を確認する</button></footer>

<div id="modal" class="modal-bg hidden" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="modal">
    <h3 id="mtitle">この内容でトークに送信します</h3>
    <div class="chatbg"><div id="preview" class="bubble"></div></div>
    <div class="btns">
      <button type="button" class="btn-sub" id="back">修正する</button>
      <button type="button" class="btn-main" id="send">送信する</button>
    </div>
    <p id="sentMsg" class="proto hidden">（試作のため送信はしません。本番ではこの文章が先生の発言としてトークに送られ、画面が閉じます）</p>
  </div>
</div>

<script>
// ===== 設定（本番ではここを編集して社員を増減） =====
const STAFF = ['島津', '植田', '藤倉', '川本', '井口', '内山', '逸見'];  // 社員マスタの7人
const PERIODS = [
  ['A', '09:20-10:50'], ['B', '11:00-12:30'], ['0', '13:20-14:50'], ['1', '15:00-16:30'],
  ['2', '16:40-18:10'], ['3', '18:20-19:50'], ['4', '20:00-21:30']
];
const SUNDAY_CLOSE = '18:30';
const GRADES = ['', '小1','小2','小3','小4','小5','小6','中1','中2','中3','高1','高2','高3','高卒'];
const WD = ['日','月','火','水','木','金','土'];
const LABEL = { from: '振替元', decided: '振替決定', wished: '振替希望' };
const HAS_SUBJECT = { from: true, decided: true, wished: false };

// ===== 初期化 =====
const $ = (id) => document.getElementById(id);
STAFF.forEach(s => $('staff').add(new Option(s, s)));
GRADES.forEach(g => $('grade').add(new Option(g || '選択しない', g)));

const lists = { from: [], decided: [], wished: [] };
let seq = 0;
let reported = null;

function toMin(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function periodAllowed(p, dateStr) {
  if (!dateStr) return true;
  const d = new Date(dateStr + 'T00:00:00');
  if (d.getDay() !== 0) return true;
  const end = PERIODS.find(x => x[0] === p)[1].split('-')[1];
  return toMin(end) <= toMin(SUNDAY_CLOSE);
}

function addRow(kind, focus) {
  const id = 'r' + (++seq);
  const row = document.createElement('div');
  row.className = 'row'; row.dataset.id = id;
  const n = lists[kind].length + 1;
  row.innerHTML = `
    <div class="row-head"><span class="num">${LABEL[kind]} ${n}</span>
      <button type="button" class="del" aria-label="この行を削除">削除</button></div>
    <div class="row-grid">
      <div><input type="date" class="d" aria-label="${LABEL[kind]}の日付"><div class="wd"></div></div>
      <div><select class="p" aria-label="${LABEL[kind]}の時限"><option value="">時限</option>
        ${PERIODS.map(([p, t]) => `<option value="${p}">${p}限 ${t}</option>`).join('')}</select></div>
      ${HAS_SUBJECT[kind] ? `<div class="full"><input type="text" class="s" placeholder="科目（例：数学）" aria-label="${LABEL[kind]}の科目"></div>` : ''}
    </div>`;
  const d = row.querySelector('.d'), p = row.querySelector('.p'), wd = row.querySelector('.wd');
  d.addEventListener('change', () => {
    if (d.value) {
      const day = new Date(d.value + 'T00:00:00').getDay();
      wd.textContent = WD[day] + '曜日' + (day === 0 ? '（18:30閉校）' : '');
      wd.classList.toggle('sun', day === 0);
    } else { wd.textContent = ''; wd.classList.remove('sun'); }
    [...p.options].forEach(o => { if (o.value) o.disabled = !periodAllowed(o.value, d.value); });
    if (p.value && !periodAllowed(p.value, d.value)) p.value = '';
    refresh();
  });
  p.addEventListener('change', refresh);
  row.querySelector('.del').addEventListener('click', () => {
    lists[kind] = lists[kind].filter(r => r !== row); row.remove(); renumber(kind); refresh();
  });
  lists[kind].push(row);
  $('list-' + kind).appendChild(row);
  if (focus) d.focus();
  refresh();
}
function renumber(kind) { lists[kind].forEach((r, i) => r.querySelector('.num').textContent = `${LABEL[kind]} ${i + 1}`); }

document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => addRow(b.dataset.add, true)));
addRow('from'); addRow('decided');

function setReported(v) {
  reported = v;
  $('yes').classList.toggle('on', v === true); $('no').classList.toggle('on', v === false);
  $('notReported').classList.toggle('hidden', v !== false);
  $('body').classList.toggle('hidden', v !== true);
  refresh();
}
$('yes').addEventListener('click', () => setReported(true));
$('no').addEventListener('click', () => setReported(false));
$('close').addEventListener('click', () => alert('（試作）本番ではここで画面が閉じます'));
$('staff').addEventListener('change', refresh);
['student'].forEach(id => $(id).addEventListener('input', refresh));
document.querySelectorAll('input[name=category]').forEach(r => r.addEventListener('change', refresh));

// ===== 入力チェック =====
function collect() {
  const items = {};
  for (const k of Object.keys(lists)) {
    items[k] = lists[k].map(r => ({
      date: r.querySelector('.d').value, period: r.querySelector('.p').value,
      subject: (r.querySelector('.s') || {}).value || ''
    }));
  }
  const cat = document.querySelector('input[name=category]:checked');
  return {
    staff: $('staff').value, student: $('student').value.trim(),
    grade: $('grade').value, category: cat ? cat.value : '', reason: $('reason').value.trim(),
    note: $('note').value.trim(), items
  };
}
function validate(v) {
  const e = [];
  if (!v.staff) e.push('報告した社員を選んでください');
  if (!v.student) e.push('生徒氏名を入れてください');
  if (!v.category) e.push('区分を選んでください');
  for (const k of Object.keys(v.items)) {
    const seen = {};
    v.items[k].forEach((it, i) => {
      const tag = `${LABEL[k]} ${i + 1}`;
      if (!it.date || !it.period) e.push(`${tag}：日付と時限を入れてください`);
      else if (!periodAllowed(it.period, it.date)) e.push(`${tag}：日曜は${it.period}限がありません`);
      const key = it.date + it.period;
      if (it.date && it.period) { if (seen[key]) e.push(`${tag}：同じ日時が重複しています`); seen[key] = 1; }
    });
  }
  if (!v.items.from.length) e.push('振替元を1件以上入れてください');
  if (!v.items.decided.length && !v.items.wished.length) e.push('振替決定日か振替希望日を1件以上入れてください');
  return e;
}
function refresh() {
  const v = collect();
  $('submit').disabled = reported !== true || !v.staff;
}

// ===== 送信文の作成 =====
function fmt(it) {
  const d = new Date(it.date + 'T00:00:00');
  const time = PERIODS.find(x => x[0] === it.period)[1];
  return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]}) ${it.period}限 ${time}${it.subject ? ' ' + it.subject : ''}`;
}
function buildMessage(v) {
  const lines = ['【振替申請】', `報告先：${v.staff}`,
    `生徒：${v.student}${v.grade ? ' ' + v.grade : ''}`, `区分：${v.category}`];
  if (v.reason) lines.push(`理由：${v.reason}`);
  for (const k of ['from', 'decided', 'wished']) {
    const arr = v.items[k];
    if (!arr.length) continue;
    lines.push('', `■${LABEL[k]} ${arr.length}件`);
    arr.forEach(it => lines.push('・' + fmt(it)));
  }
  if (v.note) lines.push('', `備考：${v.note}`);
  return lines.join('\n');
}

$('submit').addEventListener('click', () => {
  const v = collect(); const errs = validate(v);
  const box = $('errors');
  if (errs.length) {
    box.innerHTML = '入力を確認してください<ul>' + errs.map(x => `<li>${x}</li>`).join('') + '</ul>';
    box.classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
  }
  box.classList.add('hidden');
  $('preview').textContent = buildMessage(v);
  $('sentMsg').classList.add('hidden');
  $('modal').classList.remove('hidden');
  $('send').focus();
});
$('back').addEventListener('click', () => $('modal').classList.add('hidden'));
$('send').addEventListener('click', () => $('sentMsg').classList.remove('hidden'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modal').classList.add('hidden'); });
</script>
</body>
</html>
